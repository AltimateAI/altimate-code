id = "opencode"
name = "Altimate Code"
description = "The open source coding agent."
version = "1.2.26"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/AltimateAI/altimate-code"

[agent_servers.opencode]
name = "Altimate Code"
icon = "./icons/opencode.svg"

[agent_servers.opencode.targets.darwin-aarch64]
archive = "https://github.com/AltimateAI/altimate-code/releases/download/v1.2.26/opencode-darwin-arm64.zip"
cmd = "./opencode"
args = ["acp"]

[agent_servers.opencode.targets.darwin-x86_64]
archive = "https://github.com/AltimateAI/altimate-code/releases/download/v1.2.26/opencode-darwin-x64.zip"
cmd = "./opencode"
args = ["acp"]

[agent_servers.opencode.targets.linux-aarch64]
archive = "https://github.com/AltimateAI/altimate-code/releases/download/v1.2.26/opencode-linux-arm64.tar.gz"
cmd = "./opencode"
args = ["acp"]

[agent_servers.opencode.targets.linux-x86_64]
archive = "https://github.com/AltimateAI/altimate-code/releases/download/v1.2.26/opencode-linux-x64.tar.gz"
cmd = "./opencode"
args = ["acp"]

[agent_servers.opencode.targets.windows-x86_64]
archive = "https://github.com/AltimateAI/altimate-code/releases/download/v1.2.26/opencode-windows-x64.zip"
cmd = "./opencode.exe"
args = ["acp"]
