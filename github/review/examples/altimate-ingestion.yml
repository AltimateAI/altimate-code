# Example: drop-in dbt PR review for a dbt repo (e.g. altimate-ingestion).
# Copy to the target repo as `.github/workflows/dbt-pr-review.yml` and adjust the
# dbt adapter + profiles/secrets to match the warehouse.
#
# Flow: checkout (full history) → compile head + base and generate docs → altimate review.
# The review step itself needs NO warehouse access — it runs the deterministic
# engine over target/manifest.json, target/catalog.json, and both compiled-SQL trees.
name: dbt PR review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read # checkout + read the diff
  pull-requests: write # post the verdict comment / review

concurrency:
  group: dbt-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # REQUIRED: the merge-base diff needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install the dbt adapter for your warehouse (snowflake/bigquery/redshift/...).
      - name: Install dbt
        run: pip install "dbt-snowflake>=1.8,<2.0"

      # Compile HEAD to produce target/manifest.json + target/compiled, generate
      # target/catalog.json for real warehouse column types, and compile the PR
      # base into target-base/compiled for base-vs-head equivalence.
      #
      # Warehouse creds are consumed HERE (by dbt), via env_var() in profiles.yml.
      # They are NOT needed by the review step.
      #
      # SECURITY: `dbt compile` and `dbt docs generate` both execute the PR's
      # Jinja/macros against the warehouse (`run_query()` runs during compile,
      # not only during `dbt run`). A read-only role still lets a hostile macro
      # READ data. Point these credentials at an isolated CI database with
      # sanitized/synthetic data and a role scoped to it, never at production.
      # Keep the trigger on `pull_request` (not `pull_request_target`): PRs from
      # forks then receive no secrets, so this step fails. `continue-on-error`
      # lets the review step still run lint-only for such PRs; the summary
      # names the missing artifacts so the reduced fidelity is visible. Drop
      # `continue-on-error` if you would rather have fork PRs fail the job.
      - name: Build dbt review artifacts
        continue-on-error: true
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          # Route event data through env, never straight into the script.
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          dbt deps
          dbt compile
          dbt docs generate || echo "docs generate skipped — lineage/PII run without catalog column types"
          git worktree add ../dbt-review-base "origin/${PR_BASE_REF}"
          (
            cd ../dbt-review-base
            dbt deps
            dbt compile --target-path "${{ github.workspace }}/target-base"
          )

      - name: altimate dbt PR review
        # Pin to the altimate-code release that ships `altimate review`
        # (the first release cut after the dbt-pr-review feature merges).
        uses: AltimateAI/altimate-code/github/review@v0.8.5
        with:
          mode: comment # start non-blocking; switch to `gate` once trusted
          manifest_path: target/manifest.json
          severity_threshold: suggestion

          # ── Advisory LLM reviewer (OPTIONAL) ──
          # Route A — hosted altimate model (recommended for altimate repos):
          altimate_api_key: ${{ secrets.ALTIMATE_API_KEY }}
          altimate_instance: ${{ secrets.ALTIMATE_INSTANCE }} # tenant name
          #
          # Route B — bring-your-own provider (use instead of Route A):
          # model: anthropic/claude-sonnet-4-6
          # model_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          #
          # Omit both routes entirely to run a deterministic-only review (no AI comments).

          # Optional: sign the verdict envelope (tamper-evident, reproducible).
          signing_key: ${{ secrets.ALTIMATE_REVIEW_SIGNING_KEY }}
