version: 2

seeds:
  - name: raw_orders
    config:
      column_types: {order_date: date}
  - name: raw_products
    config:
      column_types: {created: timestamp, _is_deleted: boolean}
  - name: raw_payments
    config:
      column_types: {created: timestamp}
  - name: raw_refunds
    config:
      column_types: {refunded_ts: timestamp, _is_deleted: boolean}
  - name: raw_shipments
    config:
      column_types: {shipped_ts: timestamp, delivered_ts: timestamp, _is_deleted: boolean}
  - name: raw_subscriptions
    config:
      column_types: {started_ts: timestamp, canceled_ts: timestamp, _is_deleted: boolean}
  - name: raw_invoices
    config:
      column_types: {issued_ts: timestamp, due_ts: timestamp, _is_deleted: boolean}
  - name: raw_support_tickets
    config:
      column_types: {opened_ts: timestamp, closed_ts: timestamp, _is_deleted: boolean}
  - name: raw_coupons
    config:
      column_types: {expires_on: date, _is_deleted: boolean}
  - name: raw_plans
    config:
      column_types: {created: timestamp}
  - name: raw_csat_surveys
    config:
      column_types: {submitted_ts: timestamp, _is_deleted: boolean}
  - name: raw_disputes
    config:
      column_types: {opened_ts: timestamp, resolved_ts: timestamp, _is_deleted: boolean}
  - name: raw_ledger_entries
    config:
      column_types: {posted_ts: timestamp}
