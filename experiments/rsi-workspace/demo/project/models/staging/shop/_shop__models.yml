version: 2

models:
  - name: stg_shop__customers
    description: Customers, one row per customer.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_shop__orders
    description: Orders, one row per order.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
