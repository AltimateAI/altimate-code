site_name: Altimate Code
site_description: The data engineering agent for dbt, SQL, and cloud warehouses
site_url: https://altimateai.github.io/altimate-code
repo_url: https://github.com/AltimateAI/altimate-code
repo_name: AltimateAI/altimate-code

copyright: "&copy; 2026 Altimate Inc. All rights reserved."

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/images/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Getting Started:
      - Overview: getting-started/index.md
      - Quickstart: getting-started/quickstart.md
  - Examples:
      - Showcase: examples/index.md
      - Guides:
          - Cost Optimization: examples/guides/cost-optimization.md
          - Migration: examples/guides/migration.md
  - Use:
      - Agents:
          - Agent Modes: configure/agent-modes.md
          - Agent Config: configure/agents.md
      - Tools:
          - Overview: configure/tools/index.md
          - Built-in Tools: configure/tools/config.md
          - Core Tools: configure/tools/core-tools.md
          - SQL Tools: configure/tools/sql-tools.md
          - Schema Tools: configure/tools/schema-tools.md
          - FinOps Tools: configure/tools/finops-tools.md
          - Lineage Tools: configure/tools/lineage-tools.md
          - dbt Tools: configure/tools/dbt-tools.md
          - Warehouse Tools: configure/tools/warehouse-tools.md
          - Custom Tools: configure/tools/custom.md
      - Skills: configure/skills.md
      - Commands: configure/commands.md
      - Interfaces:
          - TUI: interfaces/tui.md
          - CLI: interfaces/cli.md
          - IDE: interfaces/ide.md
          - GitHub: interfaces/github.md
          - GitLab: interfaces/gitlab.md
  - Configure:
      - Overview: configure/index.md
      - Config File Reference: configure/config.md
      - Warehouses: configure/warehouses.md
      - LLMs:
          - Providers: configure/providers.md
          - Models: configure/models.md
      - MCPs & ACPs:
          - MCP Servers: configure/mcp-servers.md
          - ACP Support: configure/acp.md
      - Appearance:
          - Themes: configure/themes.md
          - Keybinds: configure/keybinds.md
      - Additional Config:
          - LSP Servers: configure/lsp.md
          - Network: reference/network.md
          - Windows / WSL: reference/windows-wsl.md
  - Governance:
      - Rules: configure/rules.md
      - Permissions: configure/permissions.md
      - Context Management: configure/context-management.md
      - Formatters: configure/formatters.md
  - Reference:
      - What's New: reference/changelog.md
      - Security FAQ: reference/security-faq.md
      - Troubleshooting: reference/troubleshooting.md
      - Telemetry: reference/telemetry.md
